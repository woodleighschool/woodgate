monorepo_root = true

[tools]
go = "1.27.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"
node = "26.8.1"
pnpm = "12.3.0"
golangci-lint = "2.13.1"
air = "1.67.4"
lefthook = "2.1.12"
periphery = { version = "3.8.0", os = ["macos"] }
swiftformat = "0.62.1"
actionlint = "1.7.12"
zizmor = "1.29.0"
oxfmt = "0.65.0"
oxlint = "1.80.0"
"npm:@commitlint/cli" = "21.2.2"

[settings]
experimental = true
pin = true
lockfile = true

[monorepo]
config_roots = ["app", "mock", "web"]

[tasks.go-deps]
description = "Download Go dependencies"
run = "go mod download"

[tasks.deps]
description = "Install backend, mock, and web dependencies"
depends = ["go-deps", "//mock:deps", "//web:deps"]

[tasks.dev]
description = "Run backend and web development servers"
run = { tasks = ["dev-backend", "//web:dev"] }

[tasks.dev-backend]
description = "Run backend development server"
run = "air"

[tasks.build]
description = "Build mock, web bundle, and backend binary"
depends = ["//mock:build", "//web:build"]
run = { task = "backend" }

[tasks.backend]
description = "Build backend binary"
run = "go build -o woodgate ./cmd/woodgate"

[tasks.tidy]
description = "Tidy the Go module"
run = "go mod tidy"

[tasks.tidy-check]
description = "Check the Go module is tidy"
run = "go mod tidy -diff"

[tasks.vulncheck]
description = "Scan for known vulnerabilities with govulncheck"
run = "govulncheck ./..."

[tasks.go-generate]
description = "Regenerate Go API and SQL code"
run = "go generate ./..."

[tasks.generate]
description = "Regenerate checked-in API and SQL code"
depends = ["go-generate", "//web:openapi-types"]

[tasks.test]
description = "Run dependency-free Go checks"
run = ["go vet ./...", "go test -race -count=1 ./..."]

[tasks.go-lint]
description = "Run Go linters"
run = "golangci-lint run"

[tasks.go-lint-fix]
description = "Run Go linters and apply fixes"
run = "golangci-lint run --fix"

[tasks.lint-fix]
description = "Run backend, mock, and web linters and apply fixes"
depends = ["go-lint-fix", "//mock:lint-fix", "//web:lint-fix"]

[tasks.lint]
description = "Run backend, mock, web, and app linters"
depends = ["go-lint", "//app:lint", "//mock:lint", "//web:lint"]

[tasks.go-format]
description = "Format Go code"
run = "go fmt ./..."

[tasks.go-fmt-check]
description = "Check Go formatting"
run = "test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }"

[tasks.format]
description = "Format backend, mock, web, and app code"
depends = ["go-format", "//app:format", "//mock:format", "//web:format"]

[tasks.fmt-check]
description = "Check backend, mock, web, and app formatting"
depends = [
  "go-fmt-check",
  "//app:fmt-check",
  "//mock:fmt-check",
  "//web:fmt-check",
]

[tasks.workflow-lint]
description = "Lint GitHub Actions workflows"
run = ["actionlint", "zizmor --offline --no-ignores .github/workflows"]

[tasks.clean]
description = "Remove local build outputs"
run = "rm -rf woodgate .air bin web/dist"

[hooks]
postinstall = "lefthook install"
