[tasks.format]
run = "swiftformat WoodGate"

[tasks.fmt-check]
run = "swiftformat WoodGate --lint"

[tasks.build]
description = "iOS simulator"
run = """
xcodebuild build \
  -project WoodGate.xcodeproj \
  -scheme WoodGate \
  -destination 'generic/platform=iOS Simulator' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.periphery]
run = """
periphery scan \
  --project WoodGate.xcodeproj \
  --schemes WoodGate \
  --format xcode \
  --strict \
  --disable-update-check \
  --relative-results \
  -- \
  -destination 'generic/platform=iOS Simulator' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.lint]
depends = [":periphery"]
