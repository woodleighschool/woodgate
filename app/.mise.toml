[tasks.format]
description = "Format Swift code"
run = "swiftformat WoodGate WoodGateTests"

[tasks.fmt-check]
description = "Check Swift formatting"
run = "swiftformat WoodGate WoodGateTests --lint"

[tasks.test]
description = "Run focused Swift tests"
run = """
xcodebuild test \
  -project WoodGate.xcodeproj \
  -scheme WoodGate \
  -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.build]
description = "Build the app for an iOS simulator"
run = """
xcodebuild build \
  -project WoodGate.xcodeproj \
  -scheme WoodGate \
  -destination 'generic/platform=iOS Simulator' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.periphery]
description = "Build the app and reject unused Swift code"
run = """
periphery scan \
  --project WoodGate.xcodeproj \
  --schemes WoodGate \
  --format xcode \
  --strict \
  --disable-update-check \
  --relative-results \
  -- \
  -destination 'generic/platform=iOS Simulator' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.lint]
description = "Run app lint"
depends = [":periphery"]
