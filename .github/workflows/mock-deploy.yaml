---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Mock Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mock-deploy.yaml"
      - "mock/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  deploy:
    name: Cloudflare Worker
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
          experimental: true
          install_args: --locked node pnpm oxfmt

      - name: Check formatting
        run: mise run //mock:fmt-check

      - name: Lint
        run: mise run //mock:lint

      - name: Test
        run: mise run //mock:test

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          workingDirectory: mock
