---
services:
  woodgate:
    image: ghcr.io/woodleighschool/woodgate:rolling
    # Uncomment below to build local source
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # pull_policy: build
    restart: unless-stopped
    env_file: .env
    environment:
      WOODGATE_DATABASE_URL: postgres://woodgate:woodgate@postgres:5432/woodgate?sslmode=disable
      WOODGATE_STORAGE_FILE_ROOT: /data
    ports:
      - "8080:8080"
    volumes:
      - woodgate-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: woodgate
      POSTGRES_PASSWORD: woodgate
      POSTGRES_DB: woodgate
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  woodgate-data:
