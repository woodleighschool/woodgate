          type: array
        total:
          format: int32
          type: integer
      required:
        - rows
        - total
      type: object
    LocationWriteRequest:
      additionalProperties: false
      properties:
        background_asset_id:
          format: uuid
          type:
            - string
            - "null"
        description:
          type: string
        enabled:
          type: boolean
        group_ids:
          items:
            format: uuid
            type: string
          type: array
        logo_asset_id:
          format: uuid
          type:
            - string
            - "null"
        name:
          type: string
        notes:
          type: boolean
        photo:
          type: boolean
      required:
        - description
        - enabled
        - group_ids
        - name
        - notes
        - photo
      type: object
    PermissionAction:
      enum:
        - read
        - create
        - write
        - delete
      type: string
    PermissionGrant:
      additionalProperties: false
      properties:
        action:
          $ref: "#/components/schemas/PermissionAction"
        asset_type:
          anyOf:
            - $ref: "#/components/schemas/AssetType"
