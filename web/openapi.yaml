          type: integer
      required:
        - rows
        - total
      type: object
  securitySchemes:
    apiKeyAuth:
      in: header
      name: X-API-Key
      type: apiKey
    sessionAuth:
      in: cookie
      name: woodgate_session
      type: apiKey
