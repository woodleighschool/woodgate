components:
  schemas:
    APIKey:
      additionalProperties: false
      properties:
        access:
          items:
            $ref: "#/components/schemas/PermissionGrant"
          type: array
        admin:
          type: boolean
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        key_prefix:
          type: string
        last_used_at:
          format: date-time
          type:
            - string
            - "null"
        name:
          type: string
      required:
        - access
        - admin
        - created_at
        - id
        - key_prefix
        - name
      type: object
    APIKeyAccessWriteRequest:
      additionalProperties: false
      properties:
        access:
          items:
            $ref: "#/components/schemas/PermissionGrant"
          type: array
        admin:
          type: boolean
      required:
        - access
        - admin
      type: object
    APIKeyCreateRequest:
      additionalProperties: false
      properties:
        expires_at:
          format: date-time
          type:
            - string
            - "null"
        name:
          type: string
      required:
        - name
      type: object
    APIKeyListResponse:
      additionalProperties: false
      properties:
        rows:
          items:
            $ref: "#/components/schemas/APIKey"
          type: array
        total:
          format: int32
          type: integer
      required:
        - rows
        - total
      type: object
    Asset:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type:
            - string
            - "null"
        type:
          $ref: "#/components/schemas/AssetType"
        updated_at:
          format: date-time
          type: string
        url:
          format: uri-reference
          type: string
      required:
        - created_at
        - id
        - type
        - updated_at
        - url
      type: object
    AssetCreateRequest:
      additionalProperties: false
      properties:
        file:
          contentMediaType: application/octet-stream
          format: binary
          type: string
        name:
          type: string
      required:
        - file
      type: object
    AssetListResponse:
      additionalProperties: false
      properties:
        rows:
          items:
            $ref: "#/components/schemas/Asset"
          type: array
        total:
          format: int32
          type: integer
      required:
        - rows
        - total
      type: object
    AssetType:
      enum:
        - asset
        - photo
      type: string
    AssetUpdateRequest:
      additionalProperties: false
      properties:
        file:
          contentMediaType: application/octet-stream
          format: binary
          type: string
        name:
          type: string
      type: object
    Checkin:
      additionalProperties: false
      properties:
        asset_id:
          format: uuid
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        created_by_id:
          format: uuid
          type: string
        created_by_kind:
          $ref: "#/components/schemas/PermissionSubjectKind"
        department:
          type: string
        direction:
          $ref: "#/components/schemas/CheckinDirection"
        id:
          format: uuid
          type: string
        location_id:
          format: uuid
          type: string
        location_name:
          type: string
        notes:
          type: string
        photo_url:
          type:
            - string
            - "null"
        user_display_name:
          type: string
        user_id:
          format: uuid
          type: string
      required:
        - created_at
        - created_by_id
        - created_by_kind
        - department
        - direction
        - id
        - location_id
        - location_name
        - notes
        - user_display_name
        - user_id
      type: object
    CheckinCreateRequest:
      additionalProperties: false
      properties:
        direction:
