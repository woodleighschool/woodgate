components:
  schemas:
    AccountBody:
      additionalProperties: false
      properties:
        effective_permissions:
          additionalProperties:
            type: string
          type: object
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
        - effective_permissions
      type: object
    AccountMutation:
      additionalProperties: false
      properties:
        name:
          type: string
        password:
          type: string
      required:
        - name
      type: object
    AssignmentsOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuthorizationAssignment"
          type: array
      required:
        - items
      type: object
    AttachmentUploadInputBody:
      additionalProperties: false
      properties:
        filename:
          minLength: 1
          type: string
      required:
        - filename
      type: object
    AuthorizationAssignment:
      additionalProperties: false
      properties:
        role_id:
          format: int64
          type: integer
        subject_id:
          format: int64
          type: integer
        subject_kind:
          type: string
      required:
        - subject_kind
        - subject_id
        - role_id
      type: object
    AuthorizationAssignmentMutation:
      additionalProperties: false
      properties:
        role_ids:
          items:
            format: int64
            type: integer
          type: array
        subject_id:
          format: int64
          minimum: 1
          type: integer
        subject_kind:
          type: string
      required:
        - subject_kind
        - subject_id
        - role_ids
      type: object
    AuthorizationDefinition:
      additionalProperties: false
      properties:
        display_name:
          type: string
        resource:
          type: string
      required:
        - resource
        - display_name
      type: object
    AuthorizationRole:
      additionalProperties: false
      properties:
        builtin:
          type: boolean
        created_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          format: int64
          type: integer
        key:
          type: string
        name:
          type: string
        permissions:
          additionalProperties:
            type: string
          type: object
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - key
        - name
        - description
        - builtin
        - permissions
        - created_at
        - updated_at
      type: object
    AuthorizationRoleMutation:
      additionalProperties: false
      properties:
        description:
          type: string
        key:
          type: string
        name:
          type: string
        permissions:
          additionalProperties:
            type: string
          type: object
      required:
        - name
        - description
        - permissions
      type: object
    Checkin:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        created_by_user_id:
          format: int64
          type: integer
        department:
          type: string
        direction:
          type: string
        id:
          format: int64
          type: integer
        location_id:
          format: int64
          type: integer
        location_name:
          type: string
        notes:
          type: string
        photo_file:
          $ref: "#/components/schemas/CheckinAttachmentFile"
        photo_object_id:
          format: int64
          type: integer
        photo_url:
          type: string
        station_id:
          format: int64
          type: integer
        user_id:
          format: int64
          type: integer
        user_name:
          type: string
      required:
        - id
        - user_id
        - user_name
        - department
        - location_id
        - location_name
        - direction
        - notes
        - created_at
      type: object
    CheckinAttachmentFile:
      additionalProperties: false
      properties:
        content_type:
          type: string
        filename:
          type: string
        sha256:
          type: string
        size_bytes:
          format: int64
          type: integer
      required:
        - filename
        - content_type
        - size_bytes
        - sha256
      type: object
    CheckinAttachmentMutation:
      additionalProperties: false
      properties:
        object_id:
          format: int64
          minimum: 1
          type: integer
      required:
        - object_id
      type: object
    CheckinAttachmentObjectView:
      additionalProperties: false
      properties:
        content_type:
          type: string
        content_url:
          type: string
        filename:
          type: string
        id:
          format: int64
          type: integer
        sha256:
          type: string
        size_bytes:
          format: int64
          type: integer
      required:
        - id
        - filename
        - content_type
        - content_url
      type: object
    CheckinCreate:
      additionalProperties: false
      properties:
        direction:
          enum:
            - check_in
            - check_out
          type: string
        location_id:
          format: int64
          minimum: 1
          type: integer
        notes:
          type: string
        user_id:
          format: int64
          minimum: 1
          type: integer
      required:
        - user_id
        - location_id
        - direction
        - notes
      type: object
    CheckinDirectUploadAction:
      additionalProperties: false
      properties:
        headers:
          additionalProperties:
            type: string
          type: object
        method:
          enum:
            - PUT
          type: string
        strategy:
          enum:
            - direct-put
          type: string
        url:
          type: string
      required:
        - strategy
        - url
        - method
      type: object
    CheckinDirectUploadTarget:
      additionalProperties: false
      properties:
        object_id:
          format: int64
          type: integer
        upload:
          $ref: "#/components/schemas/CheckinDirectUploadAction"
      required:
        - object_id
        - upload
      type: object
    CheckinLocation:
      additionalProperties: false
      properties:
        background_file:
          $ref: "#/components/schemas/CheckinAttachmentFile"
        background_object_id:
          format: int64
          type: integer
        background_url:
          type: string
        created_at:
          format: date-time
          type: string
        description:
          type: string
        enabled:
          type: boolean
        group_ids:
          items:
            format: int64
            type: integer
          type: array
        id:
          format: int64
          type: integer
        logo_file:
          $ref: "#/components/schemas/CheckinAttachmentFile"
        logo_object_id:
          format: int64
          type: integer
        logo_url:
          type: string
        name:
          type: string
        notes:
          type: boolean
        photo:
          type: boolean
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - name
        - description
        - enabled
        - notes
        - photo
        - group_ids
        - created_at
        - updated_at
      type: object
    CheckinLocationMutation:
      additionalProperties: false
      properties:
        background_object_id:
          format: int64
          minimum: 1
          type: integer
        description:
          type: string
        enabled:
          type: boolean
        group_ids:
          items:
            format: int64
            type: integer
          type: array
        logo_object_id:
          format: int64
          minimum: 1
          type: integer
        name:
          type: string
        notes:
          type: boolean
        photo:
          type: boolean
      required:
        - name
        - description
        - enabled
        - notes
        - photo
        - group_ids
      type: object
    Department:
      additionalProperties: false
      properties:
        value:
          type: string
      required:
        - value
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Group:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        display_name:
          type: string
        external_id:
          type: string
        id:
          format: int64
          type: integer
        mail_nickname:
          type: string
        member_count:
          format: int32
          type: integer
        source:
          enum:
            - local
            - entra
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - source
        - external_id
        - display_name
        - member_count
        - created_at
        - updated_at
      type: object
    PageAttachmentObjectView:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        items:
          items:
            $ref: "#/components/schemas/CheckinAttachmentObjectView"
          type: array
      required:
        - items
        - count
      type: object
    PageCheckin:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        items:
          items:
            $ref: "#/components/schemas/Checkin"
          type: array
      required:
        - items
        - count
      type: object
    PageDepartment:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        items:
          items:
            $ref: "#/components/schemas/Department"
          type: array
      required:
        - items
        - count
      type: object
    PageGroup:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        items:
          items:
            $ref: "#/components/schemas/Group"
          type: array
      required:
        - items
        - count
      type: object
    PageLocation:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        items:
          items:
            $ref: "#/components/schemas/CheckinLocation"
          type: array
      required:
        - items
        - count
      type: object
    PageStation:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        items:
          items:
            $ref: "#/components/schemas/Station"
          type: array
      required:
        - items
        - count
      type: object
    PageUser:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        items:
          items:
            $ref: "#/components/schemas/User"
          type: array
      required:
        - items
        - count
      type: object
    ResourcesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuthorizationDefinition"
          type: array
      required:
        - items
      type: object
    RolesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuthorizationRole"
          type: array
      required:
        - items
      type: object
    SessionBody:
      additionalProperties: false
      properties:
        sso_enabled:
          type: boolean
        user:
          $ref: "#/components/schemas/User"
      required:
        - sso_enabled
      type: object
    SessionCreateInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        password:
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    Station:
      additionalProperties: false
      properties:
        app_build:
          type: string
        created_at:
          format: date-time
          type: string
        enabled:
          type: boolean
        id:
          format: int64
          type: integer
        last_seen_at:
          format: date-time
          type: string
        location_id:
          format: int64
          type: integer
        name:
          type: string
        online:
          type: boolean
        protocol_version:
          format: int64
          type: integer
        secret_prefix:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - name
        - location_id
        - enabled
        - secret_prefix
        - online
        - created_at
        - updated_at
      type: object
    StationMutation:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        location_id:
          format: int64
          type: integer
        name:
          type: string
      required:
        - name
        - location_id
        - enabled
      type: object
    StationSecret:
      additionalProperties: false
      properties:
        secret:
          type: string
        station:
          $ref: "#/components/schemas/Station"
      required:
        - station
        - secret
      type: object
    SyncRun:
      additionalProperties: false
      properties:
        duration_ms:
          format: int64
          type: integer
        error:
          type: string
        finished_at:
          format: date-time
          type: string
        groups:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        outcome:
          enum:
            - succeeded
            - failed
          type: string
        queued_at:
          format: date-time
          type: string
        started_at:
          format: date-time
          type: string
        trigger:
          enum:
            - scheduled
            - manual
          type: string
        users:
          format: int64
          type: integer
      required:
        - id
        - trigger
        - queued_at
      type: object
    SyncStatus:
      additionalProperties: false
      properties:
        activity:
          enum:
            - idle
            - queued
            - running
          type: string
        current_run:
          $ref: "#/components/schemas/SyncRun"
        enabled:
          type: boolean
        last_run:
          $ref: "#/components/schemas/SyncRun"
      required:
        - enabled
        - activity
      type: object
    User:
      additionalProperties: false
      properties:
        access_enabled:
          type: boolean
        created_at:
          format: date-time
          type: string
        deleted_at:
          format: date-time
          type: string
        department:
          type: string
        email:
          format: email
          type: string
        external_id:
          type: string
        family_name:
          type: string
        given_name:
          type: string
        id:
          format: int64
          type: integer
        mail_nickname:
          type: string
        name:
          type: string
        source:
          enum:
            - local
            - entra
          type: string
        updated_at:
          format: date-time
          type: string
        user_principal_name:
          type: string
      required:
        - id
        - email
        - name
        - access_enabled
        - source
        - created_at
        - updated_at
      type: object
    UserCreate:
      additionalProperties: false
      properties:
        access_enabled:
          type: boolean
        email:
          format: email
          type: string
        name:
          type: string
        password:
          minLength: 12
          type: string
      required:
        - email
        - password
        - access_enabled
      type: object
    UserMutation:
      additionalProperties: false
      properties:
        access_enabled:
          type: boolean
        name:
          type: string
        password:
          type: string
      required:
        - name
        - access_enabled
      type: object
  securitySchemes:
    cookieAuth:
      in: cookie
      name: woodgate_session
      type: apiKey
info:
  license:
    name: Apache-2.0
  title: API
  version: 0.0.0-dev
openapi: 3.1.0
paths:
  /api/account:
    get:
      operationId: get-account
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
      summary: Get account
      tags:
        - Account
    put:
      operationId: update-account
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountMutation"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
      summary: Update account
      tags:
        - Account
  /api/authz/assignments:
    get:
      operationId: list-role-assignments
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentsOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
      security:
        - cookieAuth: []
      summary: List role assignments
      tags:
        - Authorization
      x-authz:
        access: view
        resource: authz.assignments
    put:
      operationId: replace-role-assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationAssignmentMutation"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
      summary: Replace a subject's role assignments
      tags:
        - Authorization
      x-authz:
        access: edit
        resource: authz.assignments
  /api/authz/resources:
    get:
      operationId: list-authorization-resources
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcesOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
      security:
        - cookieAuth: []
      summary: List authorization resources
      tags:
        - Authorization
      x-authz:
        access: view
        resource: authz.roles
  /api/authz/roles:
    get:
      operationId: list-roles
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
      security:
        - cookieAuth: []
      summary: List roles
      tags:
        - Authorization
      x-authz:
        access: view
        resource: authz.roles
    post:
      operationId: create-role
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationRoleMutation"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationRole"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
      summary: Create a role
      tags:
        - Authorization
      x-authz:
        access: edit
        resource: authz.roles
  /api/authz/roles/{id}:
    delete:
      operationId: delete-role
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
      summary: Delete a role
      tags:
        - Authorization
      x-authz:
        access: edit
        resource: authz.roles
    get:
      operationId: get-role
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationRole"
          description: OK
        "401":
          content:
