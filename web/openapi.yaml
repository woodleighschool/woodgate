        updated_at:
          format: date-time
          type: string
        upn:
          type: string
      required:
        - access
        - admin
        - created_at
        - department
        - display_name
        - id
        - source
        - updated_at
        - upn
      type: object
    UserAccessWriteRequest:
      additionalProperties: false
      properties:
        access:
