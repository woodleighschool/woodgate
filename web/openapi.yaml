        created_at:
          format: date-time
          type: string
        group_id:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
        user_id:
          format: uuid
          type: string
      required:
        - created_at
        - group_id
        - id
        - updated_at
        - user_id
      type: object
    GroupMembershipListResponse:
      additionalProperties: false
      properties:
        rows:
          items:
            $ref: "#/components/schemas/GroupMembership"
          type: array
        total:
          format: int32
          type: integer
      required:
        - rows
        - total
      type: object
    Location:
      additionalProperties: false
      properties:
        background_asset_id:
          format: uuid
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        description:
          type: string
        enabled:
          type: boolean
        group_ids:
          items:
            format: uuid
            type: string
          type: array
        id:
          format: uuid
          type: string
        logo_asset_id:
          format: uuid
          type:
            - string
            - "null"
        name:
          type: string
        notes:
          type: boolean
        photo:
          type: boolean
        updated_at:
          format: date-time
          type: string
      required:
        - created_at
        - description
        - enabled
        - group_ids
        - id
        - name
        - notes
        - photo
        - updated_at
      type: object
    LocationListResponse:
      additionalProperties: false
      properties:
