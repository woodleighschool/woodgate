        description:
          type: string
        id:
          format: uuid
          type: string
        member_count:
          format: int32
          type: integer
        name:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - created_at
        - description
        - id
        - member_count
        - name
        - updated_at
      type: object
    GroupListResponse:
      additionalProperties: false
      properties:
        rows:
          items:
            $ref: "#/components/schemas/Group"
          type: array
        total:
          format: int32
          type: integer
      required:
        - rows
        - total
      type: object
    GroupMembership:
      additionalProperties: false
