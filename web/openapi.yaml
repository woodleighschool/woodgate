        - resource
      type: object
    PermissionResource:
      enum:
        - users
        - groups
        - locations
        - checkins
        - assets
        - api_keys
      type: string
    PermissionSubjectKind:
      enum:
        - user
        - api_key
      type: string
    Problem:
      additionalProperties: false
      properties:
        code:
          type: string
        detail:
          type: string
        field_errors:
          items:
            $ref: "#/components/schemas/FieldError"
          type: array
        status:
          format: int32
          type: integer
        title:
          type: string
        type:
