[tasks.deps]
run = "pnpm install --frozen-lockfile"

[tasks.dev]
depends = [":deps"]
run = """
pnpm run dev
"""

[tasks.build]
description = "Type-check and build the web bundle"
depends = [":deps"]
run = "pnpm run build"

[tasks.serve]
description = "Serve the production build"
run = "pnpm run preview"

[tasks.lint]
depends = [":deps"]
run = "pnpm run lint"

[tasks.lint-fix]
depends = [":deps"]
run = "pnpm run lint:fix"

[tasks.typecheck]
depends = [":deps"]
run = "pnpm run typecheck"

[tasks.test]
depends = [":deps"]
run = "pnpm run test"

[tasks.format]
run = "pnpm run format"

[tasks.fmt-check]
run = "oxfmt --check"

[tasks.openapi-types]
description = "Generate web OpenAPI client types"
depends = [":deps"]
run = "pnpm run openapi:types"

[tasks.clean]
run = "rm -rf dist"
