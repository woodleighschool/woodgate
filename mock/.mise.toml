[tasks.deps]
run = "pnpm install --frozen-lockfile"

[tasks.types]
description = "Generate Cloudflare Worker types"
depends = [":deps"]
run = "pnpm run types"

[tasks.check]
run = [
  { task = ":fmt-check" },
  { task = ":lint" },
  { task = ":typecheck" },
  { task = ":test" },
  { task = ":build" },
]

[tasks.dev]
depends = [":types"]
run = "pnpm run dev"

[tasks.build]
depends = [":types"]
run = "pnpm run build"

[tasks.test]
depends = [":types"]
run = "pnpm run test"

[tasks.typecheck]
depends = [":types"]
run = "pnpm run typecheck"

[tasks.lint]
depends = [":deps"]
run = "pnpm run lint"

[tasks.lint-fix]
depends = [":deps"]
run = "pnpm run lint:fix"

[tasks.format]
run = "pnpm run format"

[tasks.fmt-check]
run = "pnpm run format:check"

[tasks.deploy]
description = "Deploy the development mock"
depends = [":deps"]
run = "pnpm run deploy"

[tasks.clean]
description = "Remove build output and Wrangler state"
run = "rm -rf dist .wrangler"
