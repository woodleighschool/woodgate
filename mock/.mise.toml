[tasks.deps]
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Generate Worker types and start the development server"
depends = [":deps"]
run = "pnpm run dev"

[tasks.build]
description = "Generate Worker types and build without deploying"
depends = [":deps"]
run = "pnpm run build"

[tasks.test]
description = "Generate Worker types and run tests"
depends = [":deps"]
run = "pnpm run test"

[tasks.typecheck]
description = "Generate Worker types and type-check"
depends = [":deps"]
run = "pnpm run typecheck"

[tasks.lint]
description = "Lint and type-check"
depends = [":deps"]
run = "pnpm run lint"

[tasks.lint-fix]
description = "Fix lint issues and type-check"
depends = [":deps"]
run = "pnpm run lint:fix"

[tasks.format]
run = "pnpm run format"

[tasks.fmt-check]
run = "pnpm run format:check"

[tasks.deploy]
description = "Deploy the development mock"
depends = [":deps"]
run = "pnpm run deploy"

[tasks.clean]
description = "Remove build output and Wrangler state"
run = "rm -rf dist .wrangler"
